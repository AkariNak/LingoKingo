<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recall — Language Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Serif+Display:ital@0;1&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
    .logo-badge{width:36px;height:36px;background:var(--acc);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--bg);font-weight:700;flex-shrink:0}
  </style>
</head>
<body class="dark">

<!-- ── HEADER ── -->
<div id="hdr">
  <div class="logo">
    <div class="logo-badge">R</div>
    <div>
      <span class="logo-en">recall</span>
      <span class="logo-sub">language flashcards</span>
    </div>
  </div>
  <div class="hdr-r">
    <div class="lang-wrap">
      <button class="lang-btn" id="langBtn" onclick="toggleLangMenu()">
        <span id="langFlag">🇰🇷</span>
        <span id="langLabel">Korean</span>
        <span class="lang-chev">▾</span>
      </button>
    </div>
    <button id="themeBtn" onclick="toggleTheme()">light mode</button>
    <button class="reset-btn" onclick="localStorage.clear();location.reload()" title="clear session and reload">reset</button>
  </div>
</div>

<!-- ── LANGUAGE MENU ── -->
<div class="lang-menu" id="langMenu">
  <div class="lang-option active" data-lang="korean"   onclick="switchLang('korean')">
    <span>🇰🇷</span><span>Korean</span><span class="lang-script">한국어</span>
  </div>
  <div class="lang-option" data-lang="italian"  onclick="switchLang('italian')">
    <span>🇮🇹</span><span>Italian</span><span class="lang-script">Italiano</span>
  </div>
  <div class="lang-option" data-lang="japanese" onclick="switchLang('japanese')">
    <span>🇯🇵</span><span>Japanese</span><span class="lang-script">日本語</span>
  </div>
</div>

<!-- ── TAB BAR ── -->
<div id="tabBar">
  <button class="tab-btn active" data-tab="vocab"    onclick="switchTab('vocab')">vocabulary</button>
  <button class="tab-btn"        data-tab="practice" onclick="switchTab('practice')">practice</button>
  <button class="tab-btn"        data-tab="grammar"  onclick="switchTab('grammar')">grammar</button>
  <button class="tab-btn"        data-tab="songs"    onclick="switchTab('songs')">songs</button>
  <button class="tab-btn"        data-tab="guide"    onclick="switchTab('guide')">guide</button>
  <button id="fontBtn" onclick="cycleFontSize()">text: large</button>
</div>

<!-- ── SCRIPT FILTER BUTTONS (Japanese only) ── -->
<div id="scriptFilters">
  <span class="script-filter-label">alphabet:</span>
  <button class="script-btn" data-script="hiragana"   onclick="toggleScript('hiragana')">hiragana</button>
  <button class="script-btn" data-script="katakana"   onclick="toggleScript('katakana')">katakana</button>
  <button class="script-btn" data-script="kanji"      onclick="toggleScript('kanji')">kanji</button>
  <button class="script-btn" data-script="hiragana_d" onclick="toggleScript('hiragana_d')">hiragana accents</button>
  <button class="script-btn" data-script="katakana_d" onclick="toggleScript('katakana_d')">katakana accents</button>
</div>

<!-- ── MAIN CONTENT ── -->
<div id="mainContent"></div>

<!-- ── STUDY OVERLAY ── -->
<div id="studyOverlay" onclick="overlayClick(event)">
  <div id="studyModal">
    <div class="m-hdr">
      <span id="mMeta" class="m-meta"></span>
      <button class="m-close" onclick="closeStudy()">✕</button>
    </div>
    <div id="fcard" class="fcard" onclick="flipCard()">
      <div class="face face-front" id="cFront"></div>
      <div class="face face-back"  id="cBack"></div>
    </div>
    <div class="m-actions">
      <button class="ubtn" onclick="speak(studyList[sIdx]?.kr, curLang)">▶ listen</button>
    </div>
    <div id="normalControls">
      <div class="m-nav">
        <button class="abtn accent" style="width:100%" onclick="nextCard()">next →</button>
      </div>
      <div class="m-reshuffle">
        <button class="abtn" onclick="reshuffleStudy()">↺ reshuffle</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px" id="studyExtraControls"></div>
    </div>
    <div id="srsControls" style="display:none;flex-direction:column;gap:8px">
      <div style="display:flex;gap:8px">
        <button class="abtn danger" style="flex:1;font-size:.85rem;padding:10px" id="againBtn" onclick="srsAgain()">↺ again</button>
        <button class="abtn accent" style="flex:1;font-size:.85rem;padding:10px" id="goodBtn"  onclick="srsGood()">✓ good</button>
      </div>
      <div style="text-align:center;font-size:.65rem;color:var(--mu)" id="srsHint">flip the card first</div>
    </div>
  </div>
</div>

<!-- ── CUSTOM WORD BUILDER OVERLAY ── -->
<div id="customWordOverlay">
  <div id="customWordModal">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-family:'DM Serif Display',serif;font-size:1.05rem">custom word builder</span>
      <button class="m-close" onclick="closeCustomWord()">✕</button>
    </div>
    <div style="font-size:.72rem;color:var(--mu);margin-bottom:.5rem">click letters to build a word, then fill in the meaning and save it to a deck</div>
    <div class="cwb-display" id="cwbDisplay"></div>
    <div style="display:flex;gap:6px;margin-top:.5rem">
      <input id="cwbRo"      type="text" placeholder="romanization" style="flex:1"/>
      <input id="cwbMeaning" type="text" placeholder="meaning"      style="flex:1"/>
    </div>
    <div style="display:flex;gap:6px;margin-top:.5rem">
      <button class="ubtn" onclick="cwbBackspace()">⌫ delete</button>
      <button class="ubtn" onclick="cwbClear()">clear</button>
      <button class="ubtn" onclick="cwbAddSpace()">space</button>
      <button class="abtn accent" style="margin-left:auto" onclick="cwbSave()">save to deck →</button>
    </div>
    <div id="cwbAlpha" class="cwb-alpha"></div>
  </div>
</div>

<!-- ── BOTTOM SHEET ── -->
<div id="bsOverlay" onclick="closeBs()"></div>
<div id="bottomSheet">
  <div id="bsContent"></div>
</div>

<!-- ── TOAST ── -->
<div id="toast"></div>

<!-- ── SCRIPTS ── -->
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="stories.js"></script>
<script src="app.js"></script>

</body>
</html>
